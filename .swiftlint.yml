included:
  - Sources
  - Tests

excluded:
  - Tuist
  - Derived
  - .build
  - build

disabled_rules:
  - todo
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
